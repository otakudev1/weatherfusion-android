name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK + run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherfusion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release v0.1.0 with APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: WeatherFusion v0.1.0
          body: |
            WeatherFusion Android v0.1.0 — first CI-built release.

            Keyless build: Open-Meteo (geocoding + forecast, best_match/gfs_seamless/icon_seamless),
            api.weather.gov for US alerts. No keys, no auth.
            Dashboard with provider spread + confidence badge, 5-day strip, severity-tinted NWS alert banner.
            Widgets: 4x1 and 4x2 RemoteViews, 3h WorkManager refresh, boot refresh.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
